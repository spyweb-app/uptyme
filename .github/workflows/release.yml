name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

      - name: Package release
        run: |
          mkdir -p uptyme/ui
          git ls-files | grep -v '^\.github/' | grep -v '^\.gitignore$' | grep -v '^ui/' \
            | while read f; do mkdir -p "uptyme/$(dirname "$f")" && cp -a "$f" "uptyme/$f"; done
          cp -r ui/. uptyme/ui/
          tar -czf "uptyme.tar.gz" uptyme/
          zip -r "uptyme.zip" uptyme/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uptyme.tar.gz
            uptyme.zip
          generate_release_notes: true
